services:
  - type: web
    name: ccc-origination
    runtime: docker
    region: oregon
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BROKER_EMAIL
        value: "don@dandydon.media"
      - key: SPACES_ACCESS_KEY
        sync: false
      - key: SPACES_SECRET_KEY
        sync: false
      - key: OLLAMA_BASE_URL
        sync: false
      - key: RPCCP_BASE_URL
        sync: false
      - key: RPCCP_API_KEY
        sync: false
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      # Studio (/studio/) — content production pipeline
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OMNIVOICE_URL
        sync: false
      - key: OMNIVOICE_API_KEY
        sync: false
      - key: ONLYSOCIAL_TOKEN
        sync: false
      - key: ONLYSOCIAL_WORKSPACE
        sync: false
      - key: STUDIO_MEDIA_DIR
        sync: false
      - key: IMAGEGEN_URL
        sync: false
      - key: IMAGEGEN_COMFY_WORKFLOW
        sync: false
    autoDeploy: true